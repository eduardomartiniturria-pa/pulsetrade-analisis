<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PulseTrade PRO</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
      --green: #10b981; --red: #ef4444; --blue: #3b82f6; --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.2rem; font-weight: 700; }
    .status { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    
    .section-title { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .card h3 { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .card .price { font-size: 1.1rem; font-weight: 600; }
    .card .change { font-size: 0.75rem; margin-top: 2px; }
    .up { color: var(--green); } .down { color: var(--red); }

    .signal-card { border-left: 4px solid var(--blue); margin-bottom: 10px; }
    .signal-card.long { border-left-color: var(--green); }
    .signal-card.short { border-left-color: var(--red); }
    .signal-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .signal-details { font-size: 0.75rem; color: var(--muted); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .signal-details span { display: flex; justify-content: space-between; }

    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .avgR-positive { color: var(--green); font-weight: 600; }
    .avgR-negative { color: var(--red); font-weight: 600; }

    .btn { background: var(--blue); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; width: 100%; margin-top: 20px; }
    .btn:disabled { opacity: 0.5; }
    
    .empty { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 20px; }
    #loading { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1>📈 PulseTrade PRO</h1>
    <div class="status"><span class="status-dot"></span> <span id="status-text">Conectando...</span></div>
  </header>

  <div id="loading">Cargando datos del motor...</div>

  <div id="app" style="display: none;">
    <div class="section-title">Precios en Vivo</div>
    <div class="grid" id="prices-grid"></div>

    <div class="section-title">Señales Activas</div>
    <div id="signals-container"><div class="empty">Sin señales activas en este momento.</div></div>

    <div class="section-title">Rendimiento por Estrategia (Avg R)</div>
    <div style="overflow-x: auto;">
      <table id="stats-table">
        <thead><tr><th>Activo</th><th>Estrategia</th><th>W/L</th><th>Win%</th><th>Avg R</th></tr></thead>
        <tbody id="stats-body"></tbody>
      </table>
    </div>

    <div class="section-title">Historial Reciente</div>
    <div id="history-container"></div>

    <button class="btn" id="btn-notif">🔔 Activar Notificaciones Push</button>
  </div>

  <script>
    const API_URL = window.location.origin;
    let stateData = null;

    async function fetchState() {
      try {
        const res = await fetch(`${API_URL}/api/state`);
        if (!res.ok) throw new Error('Error de red');
        stateData = await res.json();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('status-text').innerText = `Actualizado: ${new Date(stateData.updatedAt).toLocaleTimeString()}`;
        renderPrices();
        renderSignals();
        renderStats();
        renderHistory();
      } catch (e) {
        document.getElementById('status-text').innerText = 'Error de conexión';
        document.getElementById('status-text').style.color = 'var(--red)';
      }
    }

    function renderPrices() {
      const grid = document.getElementById('prices-grid');
      grid.innerHTML = '';
      const prices = stateData.prices || {};
      Object.keys(prices).forEach(sym => {
        const p = prices[sym];
        const changeClass = p.change >= 0 ? 'up' : 'down';
        const changeSign = p.change >= 0 ? '+' : '';
        grid.innerHTML += `
          <div class="card">
            <h3>${p.name || sym}</h3>
            <div class="price">${p.last ? p.last.toLocaleString('en-US', {minimumFractionDigits: p.decimals || 2}) : '--'}</div>
            <div class="change ${changeClass}">${changeSign}${(p.change || 0).toFixed(2)}%</div>
          </div>`;
      });
    }

    function renderSignals() {
      const container = document.getElementById('signals-container');
      const signals = stateData.customSignals || {};
      let html = '';
      let count = 0;
      Object.keys(signals).forEach(sym => {
        Object.keys(signals[sym]).forEach(strat => {
          const s = signals[sym][strat];
          if (s.type && s.type !== 'no-signal') {
            count++;
            const dirClass = s.type === 'long' ? 'long' : 'short';
            const dirIcon = s.type === 'long' ? '🟢 LONG' : ' SHORT';
            html += `
              <div class="card signal-card ${dirClass}">
                <div class="signal-header">
                  <span>${sym} ${dirIcon}</span>
                  <span style="color: var(--muted); font-weight: 400;">${strat.replace(/_/g, ' ')}</span>
                </div>
                <div class="signal-details">
                  <span>Entrada: <b>${s.entry ? s.entry.toFixed(2) : '--'}</b></span>
                  <span>SL: <b style="color: var(--red)">${s.sl ? s.sl.toFixed(2) : '--'}</b></span>
                  <span>TP1: <b style="color: var(--green)">${s.tp1 ? s.tp1.toFixed(2) : '--'}</b></span>
                  <span>TP2: <b style="color: var(--green)">${s.tp2 ? s.tp2.toFixed(2) : '--'}</b></span>
                </div>
              </div>`;
          }
        });
      });
      container.innerHTML = count === 0 ? '<div class="empty">Sin señales activas en este momento.</div>' : html;
    }

    function renderStats() {
      const tbody = document.getElementById('stats-body');
      tbody.innerHTML = '';
      const stats = stateData.strategyStatsBySymbol || {};
      Object.keys(stats).forEach(sym => {
        Object.keys(stats[sym]).forEach(strat => {
          const s = stats[sym][strat];
          const total = s.wins + s.losses;
          if (total === 0) return;
          const winRate = ((s.wins / total) * 100).toFixed(0);
          const avgRClass = s.avgR >= 0 ? 'avgR-positive' : 'avgR-negative';
          const avgRSign = s.avgR >= 0 ? '+' : '';
          tbody.innerHTML += `
            <tr>
              <td>${sym}</td>
              <td>${strat.replace(/_/g, ' ')}</td>
              <td>${s.wins}/${s.losses}</td>
              <td>${winRate}%</td>
              <td class="${avgRClass}">${avgRSign}${s.avgR.toFixed(2)}</td>
            </tr>`;
        });
      });
      if (tbody.innerHTML === '') tbody.innerHTML = '<tr><td colspan="5" class="empty">Sin datos de backtest aún.</td></tr>';
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      const history = stateData.history || [];
      if (history.length === 0) {
        container.innerHTML = '<div class="empty">Sin historial de señales.</div>';
        return;
      }
      let html = '';
      history.slice(0, 10).forEach(h => {
        const resColor = h.result === 'win' ? 'var(--green)' : (h.result === 'loss' ? 'var(--red)' : 'var(--muted)');
        html += `
          <div class="card" style="margin-bottom: 8px; padding: 10px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
              <b>${h.symbol} ${h.type.toUpperCase()}</b>
              <span style="color: ${resColor}; text-transform: uppercase;">${h.result}</span>
            </div>
            <div style="font-size: 0.7rem; color: var(--muted); margin-top: 4px;">
              ${h.source || 'smc'} · ${new Date(h.timestamp).toLocaleString()}
            </div>
          </div>`;
      });
      container.innerHTML = html;
    }

    // Notificaciones Push
    document.getElementById('btn-notif').addEventListener('click', async () => {
      if (!('serviceWorker' in navigator)) return alert('Tu navegador no soporta notificaciones.');
      try {
        const reg = await navigator.serviceWorker.register('/service-worker.js');
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(await getVapidKey()) });
        await fetch(`${API_URL}/api/subscribe`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(sub) });
        document.getElementById('btn-notif').innerText = '✅ Notificaciones Activadas';
        document.getElementById('btn-notif').disabled = true;
      } catch (e) {
        alert('Error al activar notificaciones: ' + e.message);
      }
    });

    async function getVapidKey() {
      const res = await fetch(`${API_URL}/api/vapid-public-key`);
      const data = await res.json();
      return data.key;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    // Inicio
    fetchState();
    setInterval(fetchState, 15000); // Refresca cada 15 segundos
  </script>
</body>
</html>
