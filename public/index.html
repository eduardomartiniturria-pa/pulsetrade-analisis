<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PulseTrade PRO - Motor de Señales</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0f1a">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#0a0f1a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:100px}
  .header{background:#0d1321;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a2332;position:sticky;top:0;z-index:100}
  .header-left{display:flex;align-items:center;gap:12px}
  .logo-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#0891b2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 0 12px rgba(6,182,212,0.3)}
  .header-title{font-size:1.2rem;font-weight:700;color:#f8fafc}
  .header-sub{font-size:0.7rem;color:#64748b;margin-top:1px}
  .header-actions{display:flex;gap:10px}
  .header-btn{width:38px;height:38px;border-radius:10px;background:#1a2332;border:1px solid #2d3a4f;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#94a3b8;cursor:pointer}
  .header-btn.active{background:linear-gradient(135deg,#06b6d4,#0891b2);border-color:transparent;color:#fff;box-shadow:0 0 12px rgba(6,182,212,0.4)}
  .symbol-section{padding:12px 16px 0}
  .section-label{font-size:0.65rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}
  .symbol-row{display:flex;gap:8px;overflow-x:auto}
  .symbol-row::-webkit-scrollbar{display:none}
  .symbol-chip{padding:10px 18px;border-radius:14px;background:#1a2332;border:1px solid #2d3a4f;color:#94a3b8;font-size:0.8rem;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
  .asset-block{margin-top:8px}
  .asset-block-header{display:flex;align-items:center;gap:8px;padding:18px 16px 4px}
  .asset-block-title{font-size:1.05rem;font-weight:800;color:#f8fafc}
  .price-card{background:#1a2332;border-radius:14px;padding:14px 16px;border:1px solid #2d3a4f;margin:8px 16px}
  .price-label{font-size:0.8rem;color:#64748b;margin-bottom:4px}
  .price-main{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .price-value{font-size:1.6rem;font-weight:700;font-family:'SF Mono',monospace;color:#f8fafc;letter-spacing:-0.5px}
  .price-change{padding:4px 10px;border-radius:8px;font-size:0.75rem;font-weight:600;background:rgba(34,197,94,0.15);color:#4ade80;display:flex;align-items:center;gap:4px}
  .price-change.down{background:rgba(239,68,68,0.15);color:#f87171}
  .spread-row{display:flex;gap:12px;margin-top:10px}
  .spread-box{flex:1;background:#0d1321;border-radius:10px;padding:10px;border:1px solid #1a2332;text-align:center}
  .spread-label{font-size:0.6rem;color:#64748b;text-transform:uppercase;letter-spacing:1px}
  .spread-value{font-size:0.9rem;font-weight:700;font-family:'SF Mono',monospace;color:#e2e8f0}
  .spread-value.bid{color:#f87171}
  .spread-value.ask{color:#4ade80}
  .spread-value.spread{color:#fbbf24}
  .spread-estimated-note{font-size:0.65rem;color:#fbbf24;margin-top:8px}
  .signal-card{border-radius:24px;margin:0 16px 16px;padding:20px;position:relative;overflow:hidden;border:2px solid}
  .signal-card.long{background:linear-gradient(180deg,rgba(34,197,94,0.08),rgba(34,197,94,0.02));border-color:rgba(34,197,94,0.4);box-shadow:0 0 30px rgba(34,197,94,0.1)}
  .signal-card.short{background:linear-gradient(180deg,rgba(239,68,68,0.08),rgba(239,68,68,0.02));border-color:rgba(239,68,68,0.4);box-shadow:0 0 30px rgba(239,68,68,0.1)}
  .signal-card.no-signal{background:#1a2332;border-color:#2d3a4f;opacity:0.85}
  .signal-card.no-data,.signal-card.market-closed-card{background:#131a25;border-color:#2a3545;opacity:0.75}
  .signal-title{display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:700;color:#f8fafc;margin-bottom:12px}
  .signal-badges-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .badge-trend{padding:6px 14px;border-radius:10px;font-size:0.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
  .badge-trend.bullish{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.25)}
  .badge-trend.bearish{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.25)}
  .badge-active{padding:6px 14px;border-radius:10px;font-size:0.8rem;font-weight:700;background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff}
  .badge-offline{padding:6px 14px;border-radius:10px;font-size:0.8rem;font-weight:700;background:#475569;color:#94a3b8}
  .badge-closed{padding:6px 14px;border-radius:10px;font-size:0.8rem;font-weight:700;background:#2d3a4f;color:#64748b;border:1px solid #3d4a5f}
  .badge-smc{padding:4px 10px;border-radius:8px;font-size:0.7rem;font-weight:600;background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.25)}
  .badge-resolved{padding:6px 14px;border-radius:10px;font-size:0.8rem;font-weight:700}
  .badge-resolved.win{background:rgba(34,197,94,0.15);color:#4ade80}
  .badge-resolved.loss{background:rgba(239,68,68,0.15);color:#f87171}
  .signal-action-row{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .signal-action{font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-1px}
  .signal-action.long{color:#4ade80;text-shadow:0 0 25px rgba(74,222,128,0.3)}
  .signal-action.short{color:#f87171;text-shadow:0 0 25px rgba(248,113,113,0.3)}
  .signal-pair{font-size:1.1rem;color:#64748b;font-weight:500}
  .signal-reason{font-size:0.85rem;color:#94a3b8;margin-bottom:16px;line-height:1.4}
  .levels-row{display:flex;gap:8px;margin-bottom:8px}
  .level-box{flex:1;padding:14px 10px;border-radius:14px;text-align:left;background:#0d1321;border:1px solid}
  .level-box.entry{border-color:rgba(59,130,246,0.25)}
  .level-box.sl{border-color:rgba(239,68,68,0.25)}
  .level-box.tp{border-color:rgba(34,197,94,0.25)}
  .level-label{font-size:0.65rem;color:#64748b;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:600}
  .level-value{font-size:1.15rem;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-0.5px}
  .level-value.entry{color:#f8fafc}
  .level-value.sl{color:#f87171}
  .level-value.tp{color:#4ade80}
  .level-diff{font-size:0.7rem;color:#64748b;margin-top:2px}
  .price-live-row{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .price-live-label{font-size:0.7rem;color:#64748b}
  .price-live-value{font-size:0.9rem;font-weight:700;font-family:'SF Mono',monospace}
  .price-move{font-size:0.7rem;font-weight:600;padding:2px 8px;border-radius:6px;margin-left:6px}
  .price-move.favorable{background:rgba(34,197,94,0.15);color:#4ade80}
  .price-move.against{background:rgba(239,68,68,0.15);color:#f87171}
  .signal-footer{display:flex;justify-content:space-between;font-size:0.7rem;color:#64748b;margin-top:10px}
  .autotune-bar{margin:0 16px 12px;padding:10px 14px;border-radius:12px;background:#151d2b;border:1px solid #232f42;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:0.72rem}
  .autotune-label{font-weight:700;color:#38bdf8}
  .autotune-detail{color:#94a3b8}
  .divider{height:1px;background:#1a2332;margin:8px 16px}
  .section-label-hist{font-size:0.65rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:20px 16px 8px}
  .history-card{background:#1a2332;border-radius:14px;padding:14px;margin:0 16px 8px;border:1px solid #2d3a4f}
  .history-top{display:flex;justify-content:space-between;align-items:center}
  .history-left{font-size:0.85rem;color:#f8fafc;font-weight:600}
  .history-detail{font-size:0.7rem;color:#64748b;margin-top:2px}
  .history-levels{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.05);font-size:0.72rem;font-family:'SF Mono',monospace}
  .history-levels span{color:#64748b}
  .history-levels b{color:#e2e8f0;font-weight:700}
  .history-meta{font-size:0.68rem;color:#64748b;margin-top:6px}
  .history-empty{text-align:center;padding:20px;color:#64748b;font-size:0.8rem}
  .last-updated{font-size:0.65rem;color:#475569;text-align:center;margin:6px 0}
  @media(max-width:380px){.signal-action{font-size:2rem}.price-value{font-size:1.3rem}.level-value{font-size:1rem}}
  ::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="logo-icon">📈</div>
    <div>
      <div class="header-title">PulseTrade</div>
      <div class="header-sub">Motor corriendo 24/7 en el servidor</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="header-btn" id="subBtn" title="Notificaciones">🔔</button>
  </div>
</div>

<div class="symbol-section">
  <div class="section-label">Ir a</div>
  <div class="symbol-row" id="symbolRow"></div>
</div>

<div id="app"></div>

<div class="section-label-hist">Historial reciente</div>
<div id="history"></div>
<div class="last-updated" id="status">Cargando...</div>

<script>
const ASSET_ORDER = ['BTCUSD','ETHUSD','EURUSD','XAUUSD'];
let lastState = null;

function fmt(n, d) { return (n === null || n === undefined || isNaN(n)) ? '--' : Number(n).toFixed(d); }
function fmtPips(p) { return (p === null || p === undefined) ? '' : Math.abs(p).toFixed(1) + ' pips'; }
// Redondea porcentajes de confianza a un entero — antes se mostraban con hasta 14 decimales.
function fmtPct(p) { return (p === null || p === undefined || isNaN(p)) ? '0' : Math.round(p); }

async function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function setupPush() {
  const btn = document.getElementById('subBtn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { btn.disabled = true; return; }
  const reg = await navigator.serviceWorker.register('/service-worker.js');
  const existing = await reg.pushManager.getSubscription();
  if (existing) btn.classList.add('active');
  btn.addEventListener('click', async () => {
    if (btn.classList.contains('active')) return;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const { key } = await fetch('/api/vapid-public-key').then(r => r.json());
    if (!key) return;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: await urlBase64ToUint8Array(key) });
    await fetch('/api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
    btn.classList.add('active');
  });
}

// Ya no filtran qué activo se ve — son atajos que saltan a la sección de ese activo,
// porque ahora los 4 se muestran siempre, uno debajo del otro.
function renderSymbolTabs() {
  const row = document.getElementById('symbolRow');
  row.innerHTML = ASSET_ORDER.map(sym => `<a class="symbol-chip" href="#block-${sym}">${sym}</a>`).join('');
}

function renderPriceCard(symbol) {
  const p = lastState.prices && lastState.prices[symbol];
  if (!p) return '';
  const changeClass = p.change < 0 ? 'down' : '';
  let spreadHtml = '';
  if (p.bid && p.ask) {
    spreadHtml = `<div class="spread-row">
      <div class="spread-box"><div class="spread-label">Bid</div><div class="spread-value bid">${fmt(p.bid, p.decimals)}</div></div>
      <div class="spread-box"><div class="spread-label">Ask</div><div class="spread-value ask">${fmt(p.ask, p.decimals)}</div></div>
      <div class="spread-box"><div class="spread-label">Spread</div><div class="spread-value spread">${p.spread !== null ? p.spread.toFixed(1) + 'p' : '--'}</div></div>
    </div>
    ${p.estimatedSpread ? '<div class="spread-estimated-note">⚠️ Bid/Ask estimado (el proveedor no entrega spread real) — no usar para órdenes límite</div>' : ''}`;
  }
  return `<div class="price-card">
    <div class="price-label">${p.name} · Fuente: ${p.source}</div>
    <div class="price-main">
      <span class="price-value">${fmt(p.last, p.decimals)}</span>
      <span class="price-change ${changeClass}">${p.change >= 0 ? '▲' : '▼'} ${Math.abs(p.change).toFixed(2)}%</span>
    </div>
    ${spreadHtml}
  </div>`;
}

function renderSignalCard(symbol) {
  const d = lastState.signals && lastState.signals[symbol];
  if (!d) return `<div class="signal-card no-data"><div class="signal-title">⏳ Esperando primer ciclo del motor...</div></div>`;

  if (d.type === 'market-closed') {
    return `<div class="signal-card market-closed-card">
      <div class="signal-title">🌙 Mercado cerrado</div>
      <div class="signal-badges-row"><span class="badge-closed">Fuera de horario</span></div>
      <div class="signal-reason">Este activo no cotiza en este momento.</div>
    </div>`;
  }
  if (d.type === 'no-data') {
    return `<div class="signal-card no-data">
      <div class="signal-title">⚠️ Sin datos suficientes</div>
      <div class="signal-reason">${d.reason || 'No se pudieron obtener velas para este activo.'}</div>
    </div>`;
  }
  if (d.type === 'no-signal') {
    const a = d.analysis;
    const conf = fmtPct(a ? a.confidence : 0);
    let reason = `El motor SMC no encontró un patrón por encima del umbral actual (${a ? fmtPct(a.confidenceThreshold) : 75}%).`;
    if (a) {
      if (a.filteredByVolume) reason = 'Se detectó un patrón, pero el volumen no confirmó el movimiento.';
      else if (a.filteredByCandle) reason = 'Se detectó un patrón, pero faltó una vela de confirmación en la dirección esperada.';
      else if (a.filteredByMitigation) reason = 'Se detectó un patrón, pero el nivel todavía no fue mitigado (modo estricto).';
      else if (a.filteredByPremiumDiscount) reason = 'Se detectó un patrón, pero el precio está en una zona premium/descuento desfavorable.';
      else if (a.filteredByHTF) reason = 'Se detectó un patrón, pero contradice la tendencia del timeframe mayor.';
    }
    return `<div class="signal-card no-signal">
      <div class="signal-title">⏸️ Sin señal clara</div>
      <div class="signal-badges-row"><span class="badge-offline">Confianza ${conf}%</span></div>
      <div class="signal-reason">${reason}</div>
    </div>`;
  }

  const s = d.frozen;
  const isLong = s.type === 'long';
  const dec = s.decimals;
  const cur = d.currentPrice;
  let resolvedBadge = '';
  if (d.hitTP) resolvedBadge = '<span class="badge-resolved win">✅ TP1 alcanzado</span>';
  else if (d.hitSL) resolvedBadge = '<span class="badge-resolved loss">🛑 SL alcanzado</span>';

  let moveHtml = '';
  if (cur !== undefined && cur !== null) {
    const movedFav = isLong ? cur > s.entry : cur < s.entry;
    const moveClass = movedFav ? 'favorable' : 'against';
    moveHtml = `<div class="price-live-row">
      <span class="price-live-label">Precio actual</span>
      <span><span class="price-live-value">${fmt(cur, dec)}</span>
      <span class="price-move ${moveClass}">${movedFav ? '▲' : '▼'} desde la señal</span></span>
    </div>`;
  }

  return `<div class="signal-card ${isLong ? 'long' : 'short'}">
    <div class="signal-title">⚡ Señal SMC</div>
    <div class="signal-badges-row">
      <span class="badge-trend ${s.trend === 'bullish' ? 'bullish' : 'bearish'}">${s.trend === 'bullish' ? '📈 Tendencia alcista' : '📉 Tendencia bajista'}</span>
      <span class="badge-active">Confianza ${fmtPct(s.confidence)}%</span>
      ${s.isConfluence ? `<span class="badge-smc">🔗 Confluencia (${s.strategyLabels.length})</span>` : '<span class="badge-smc">🎯 Individual</span>'}
      ${s.killZone ? '<span class="badge-smc">🕐 Kill Zone</span>' : ''}
      ${resolvedBadge}
    </div>
    <div class="signal-action-row">
      <span class="signal-action ${isLong ? 'long' : 'short'}">${isLong ? 'LONG' : 'SHORT'}</span>
      <span class="signal-pair">${s.asset.name}</span>
    </div>
    <div class="signal-reason">${(s.details || []).join(' · ')}</div>
    <div class="levels-row">
      <div class="level-box entry"><div class="level-label">Entrada</div><div class="level-value entry">${fmt(s.entry, dec)}</div></div>
      <div class="level-box sl"><div class="level-label">Stop Loss</div><div class="level-value sl">${fmt(s.sl, dec)}</div><div class="level-diff">${fmtPips(s.slPips)}</div></div>
      <div class="level-box tp"><div class="level-label">TP1</div><div class="level-value tp">${fmt(s.tp1, dec)}</div><div class="level-diff">${fmtPips(s.tp1Pips)}</div></div>
    </div>
    <div class="levels-row">
      <div class="level-box tp"><div class="level-label">TP2</div><div class="level-value tp">${fmt(s.tp2, dec)}</div><div class="level-diff">${fmtPips(s.tp2Pips)}</div></div>
    </div>
    ${moveHtml}
    <div class="signal-footer">
      <span>RR ${s.rr1 || ''} / ${s.rr2 || ''}</span>
      <span>Detectada ${new Date(s.detectedAt || s.timestamp).toLocaleTimeString('es-AR')}</span>
    </div>
  </div>`;
}

function renderAutoTune(symbol) {
  if (!lastState.autoTune || !lastState.autoTune.threshold) return '';
  const t = lastState.autoTune.threshold[symbol];
  if (t === undefined) return '';
  return `<div class="autotune-bar"><span class="autotune-label">🧪 Auto-tune</span><span class="autotune-detail">Umbral de confianza actual para ${symbol}: ${fmtPct(t)}%</span></div>`;
}

// Un bloque completo por activo: título, precio, tarjeta de señal y auto-tune. Los 4 se
// concatenan uno debajo del otro, así se ven todos sin tener que elegir una pestaña.
function renderAssetBlock(symbol) {
  return `<div class="asset-block" id="block-${symbol}">
    <div class="asset-block-header"><span class="asset-block-title">${symbol}</span></div>
    ${renderPriceCard(symbol)}
    ${renderSignalCard(symbol)}
    ${renderAutoTune(symbol)}
  </div>
  <div class="divider"></div>`;
}

function renderHistory() {
  const el = document.getElementById('history');
  const hist = lastState.history || [];
  if (!hist.length) { el.innerHTML = '<div class="history-empty">Todavía no hay historial.</div>'; return; }
  el.innerHTML = hist.slice(0, 15).map(h => {
    const dec = h.decimals ?? 2;
    const resultBadge = h.result === 'win' ? '✅ Ganó' : h.result === 'loss' ? '🛑 Perdió' : '⏳ Pendiente';
    const resultClass = h.result === 'win' ? 'win' : h.result === 'loss' ? 'loss' : '';
    return `
    <div class="history-card">
      <div class="history-top">
        <div>
          <div class="history-left">${h.symbol} <span style="color:${h.type === 'long' ? '#4ade80' : '#f87171'}">${(h.type || '').toUpperCase()}</span></div>
          <div class="history-detail">${new Date(h.timestamp).toLocaleString('es-AR')}</div>
        </div>
        <div class="badge-resolved ${resultClass}">${resultBadge}</div>
      </div>
      <div class="history-levels">
        <span>Entrada <b>${fmt(h.entry, dec)}</b></span>
        <span>SL <b>${fmt(h.sl, dec)}</b></span>
        <span>TP1 <b>${fmt(h.tp1, dec)}</b></span>
        <span>TP2 <b>${fmt(h.tp2, dec)}</b></span>
      </div>
      <div class="history-meta">Confianza ${fmtPct(h.confidence)}%${h.rMultiple !== null && h.rMultiple !== undefined ? ` · Resultado ${h.rMultiple > 0 ? '+' : ''}${h.rMultiple.toFixed(2)}R` : ''}</div>
    </div>`;
  }).join('');
}

function render() {
  renderSymbolTabs();
  document.getElementById('app').innerHTML = ASSET_ORDER.map(sym => renderAssetBlock(sym)).join('');
  renderHistory();
}

async function refresh() {
  try {
    lastState = await fetch('/api/state').then(r => r.json());
    render();
    document.getElementById('status').textContent = `Actualizado ${new Date(lastState.updatedAt).toLocaleTimeString('es-AR')} · ${lastState.subscriberCount} dispositivo(s) recibiendo notificaciones`;
  } catch (e) {
    document.getElementById('status').textContent = 'No se pudo conectar con el servidor.';
  }
}

setupPush();
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
